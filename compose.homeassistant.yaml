# Home Assistant Container: paste into your existing "matterbase" Dockhand stack.
# Set HOME_ASSISTANT_ORIGIN in the stack environment to the HA URL in your browser,
# e.g. http://192.0.2.10:8123 or https://ha.example.com (scheme + host + port only).
services:
  matterbase:
    image: ghcr.io/tomchilvers/matterbase:latest
    pull_policy: always
    ports:
      - "${MATTERBASE_PORT:-8000}:8000"
    volumes:
      - matterbase-data:/data
    environment:
      DATA_DIR: /data
      MATTERBASE_HOME_ASSISTANT_HELP: "1"
      MATTERBASE_FRAME_ANCESTORS: "${HOME_ASSISTANT_ORIGIN:?Set HOME_ASSISTANT_ORIGIN to your Home Assistant browser URL}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  matterbase-data:
