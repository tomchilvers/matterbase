services:
  matterbase:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - matterbase-data:/data
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      # Allow only your Home Assistant browser origin; blank keeps embedding disabled.
      # Set this in Dockhand's stack environment or a .env file beside this Compose file.
      MATTERBASE_FRAME_ANCESTORS: "${MATTERBASE_FRAME_ANCESTORS:-${HOME_ASSISTANT_ORIGIN:-}}"
      MATTERBASE_HOME_ASSISTANT_HELP: "${MATTERBASE_HOME_ASSISTANT_HELP:-0}"
    security_opt:
      - no-new-privileges:true
volumes:
  matterbase-data:
