name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest==9.0.1
      - name: Run tests
        run: python -m pytest -q
      - name: Test recognition edit protection
        run: node --test tests/*.test.mjs
      - name: Validate Dockhand Compose file
        run: docker compose -f compose.dockhand.yaml config --quiet
      - name: Package local Home Assistant add-on
        run: python scripts/package_addon.py /tmp/matterbase-homeassistant.tar.gz
      - name: Upload local-install source bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: matterbase-homeassistant
          path: /tmp/matterbase-homeassistant.tar.gz
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }} ${{ matrix.arch }} image
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        target: [standalone, homeassistant]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            hass_arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            hass_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: BUILD_ARCH=${{ matrix.hass_arch }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.image.outputs.name }}:build-${{ github.sha }}-${{ matrix.target }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
      - name: Smoke test published image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.name }}:build-${{ github.sha }}-${{ matrix.target }}-${{ matrix.arch }}
        run: |
          docker run -d --name matterbase-smoke "$IMAGE_TAG"
          trap 'docker rm -f matterbase-smoke' EXIT
          for attempt in {1..30}; do
            if docker exec matterbase-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "${ready:-0}" != 1 ]; then
            docker logs matterbase-smoke
            exit 1
          fi
          if [ "${{ matrix.target }}" = homeassistant ]; then
            docker exec matterbase-smoke python -c 'from pathlib import Path; assert Path("/proc/1/status").read_text().split("Uid:")[1].split()[0] == "10001"'
            docker network create --subnet 172.30.32.0/24 matterbase-ingress
            trap 'docker rm -f matterbase-smoke; docker network rm matterbase-ingress' EXIT
            docker network connect --ip 172.30.32.10 matterbase-ingress matterbase-smoke
            docker run --rm -i --network matterbase-ingress --ip 172.30.32.2 \
              --entrypoint python "$IMAGE_TAG" - < scripts/smoke_addon.py
          fi

  publish:
    name: Publish combined image tags
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Matterbase
            org.opencontainers.image.description=A mobile-first library for Matter pairing codes
      - name: Merge architecture images and publish tags
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$IMAGE_METADATA")
          arguments=()
          for tag in "${tags[@]}"; do
            arguments+=(--tag "$tag")
          done
          docker buildx imagetools create "${arguments[@]}" \
            "$IMAGE_NAME:build-$COMMIT_SHA-standalone-amd64" \
            "$IMAGE_NAME:build-$COMMIT_SHA-standalone-arm64"
          addon_version=$(python -c 'import json; print(json.load(open("homeassistant/matterbase/config.json"))["version"])')
          addon_tags=(--tag "$IMAGE_NAME:ha-sha-${COMMIT_SHA:0:7}")
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            addon_tags+=(--tag "$IMAGE_NAME:ha-latest")
            # Released Supervisor versions are immutable. New app releases bump config.json.
            if ! docker buildx imagetools inspect "$IMAGE_NAME:$addon_version" >/dev/null 2>&1; then
              addon_tags+=(--tag "$IMAGE_NAME:$addon_version")
            fi
          fi
          docker buildx imagetools create "${addon_tags[@]}" \
            "$IMAGE_NAME:build-$COMMIT_SHA-homeassistant-amd64" \
            "$IMAGE_NAME:build-$COMMIT_SHA-homeassistant-arm64"
      - name: Verify published manifest
        env:
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          image_tag=$(jq -r '.tags[0]' <<< "$IMAGE_METADATA")
          docker buildx imagetools inspect "$image_tag" --raw > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | (index("amd64") != null and index("arm64") != null)' manifest.json
          docker buildx imagetools inspect "$IMAGE_NAME:ha-sha-${GITHUB_SHA:0:7}" --raw > addon-manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | (index("amd64") != null and index("arm64") != null)' addon-manifest.json
